<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錯題紀錄系統 (雲端題庫版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f2f5; overscroll-behavior: none; }
        
        /* UI 元件樣式 */
        .btn-primary { @apply bg-teal-600 text-white hover:bg-teal-700 transition shadow-md; }
        .btn-secondary { @apply bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 transition; }
        .tab-active { @apply border-b-2 border-teal-600 text-teal-700 font-bold; }
        .tab-inactive { @apply text-gray-400 hover:text-gray-600; }
        
        /* 畫布背景 */
        .grid-bg {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* B5 紙張 (RWD: 手機上縮小顯示) */
        #pdf-content {
            width: 176mm; min-height: 250mm; background: white; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform-origin: top center;
        }
        
        /* 載入動畫 */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #0d9488; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <div class="w-full md:w-96 bg-white shadow-xl z-20 flex flex-col h-1/2 md:h-full border-r border-gray-200 order-2 md:order-1">
        
        <div class="flex border-b">
            <button onclick="switchTab('upload')" id="tab-upload" class="flex-1 py-4 text-center tab-active">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i>新增題目
            </button>
            <button onclick="switchTab('library')" id="tab-library" class="flex-1 py-4 text-center tab-inactive">
                <i class="fa-solid fa-folder-open mr-2"></i>從題庫選
            </button>
        </div>

        <div id="panel-upload" class="flex-1 p-6 flex flex-col overflow-y-auto">
            <div class="space-y-4">
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <div id="preview-area">
                        <i class="fa-regular fa-image text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500 text-sm">點擊選擇相簿照片<br>或是 Ctrl+V 貼上</p>
                    </div>
                    <img id="img-preview" class="hidden max-h-40 mx-auto rounded shadow-sm object-contain">
                </div>
                <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileSelect(this)">

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">選擇科目</label>
                    <select id="upload-subject" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-teal-500 outline-none">
                        <option value="國文">國文</option>
                        <option value="英文">英文</option>
                        <option value="數學">數學</option>
                        <option value="生物">生物</option>
                        <option value="理化">理化</option>
                        <option value="地科">地科</option>
                        <option value="歷史">歷史</option>
                        <option value="地理">地理</option>
                        <option value="公民">公民</option>
                    </select>
                </div>

                <button id="btn-upload" onclick="uploadToCloud()" class="w-full py-3 rounded-lg font-bold btn-primary flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-cloud-upload mr-2"></i> 儲存到雲端題庫
                </button>
                <p id="upload-status" class="text-center text-sm text-gray-500 h-5"></p>
            </div>
        </div>

        <div id="panel-library" class="hidden flex-1 p-4 flex flex-col overflow-hidden">
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-400">篩選科目</label>
                <select id="filter-subject" onchange="loadQuestions()" class="w-full p-2 border rounded bg-white mt-1">
                    <option value="all">全部顯示</option>
                    <option value="國文">國文</option>
                    <option value="英文">英文</option>
                    <option value="數學">數學</option>
                    <option value="生物">生物</option>
                    <option value="理化">理化</option>
                    <option value="地科">地科</option>
                    <option value="歷史">歷史</option>
                    <option value="地理">地理</option>
                    <option value="公民">公民</option>
                </select>
            </div>
            
            <div id="library-grid" class="flex-1 overflow-y-auto grid grid-cols-2 gap-3 pb-4 no-scrollbar">
                <div class="col-span-2 text-center text-gray-400 py-10">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>載入題庫中...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 bg-gray-200 overflow-auto relative flex flex-col order-1 md:order-2 h-1/2 md:h-full">
        <div class="bg-white p-3 shadow-sm flex justify-between items-center sticky top-0 z-10">
            <h2 class="font-bold text-gray-700"><i class="fa-solid fa-pen-to-square mr-2"></i>編輯試卷</h2>
            <button onclick="downloadPDF()" class="bg-gray-800 text-white px-3 py-1.5 rounded text-sm hover:bg-black flex items-center">
                <i class="fa-solid fa-download mr-1"></i> 下載 B5
            </button>
        </div>

        <div class="flex-1 p-4 md:p-8 flex justify-center overflow-auto">
            <div id="canvas-scaler" style="transform-origin: top center;">
                <div id="pdf-content" class="grid-bg relative transition-all">
                    <div class="p-8 pb-4 border-b-2 border-gray-800 mb-4 flex justify-between items-end">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-800">錯題筆記</h1>
                            <p class="text-sm text-gray-500 mt-1">Designed by You</p>
                        </div>
                        <div class="text-right">
                            <input type="text" placeholder="科目/日期" class="text-right text-gray-500 bg-transparent border-none focus:ring-0 text-lg w-40">
                        </div>
                    </div>

                    <div id="questions-container" class="p-8 pt-0 h-[800px]">
                        <div id="empty-hint" class="text-gray-300 text-center mt-32 pointer-events-none select-none">
                            <i class="fa-regular fa-hand-point-left text-4xl mb-2 md:hidden"></i>
                            <i class="fa-regular fa-hand-point-left text-4xl mb-2 hidden md:inline-block rotate-180"></i>
                            <p>請從「題庫」點選題目<br>加入此頁面</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 設定檔
        const firebaseConfig = {
            apiKey: "AIzaSyADCazAIbNTwIdr3VO1Q05sJzvni4rvezA",
            authDomain: "wrong-34862.firebaseapp.com",
            projectId: "wrong-34862",
            storageBucket: "wrong-34862.firebasestorage.app",
            messagingSenderId: "100761873917",
            appId: "1:100761873917:web:6f82d3e744828694b43d94",
            measurementId: "G-DER4Q7G6YN"
        };

        // 初始化
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        // 狀態變數
        let currentUploadBlob = null;

        // === 1. 上傳邏輯 (修正轉圈圈) ===
        window.uploadToCloud = async () => {
            if (!currentUploadBlob) {
                alert("請先選擇或貼上照片！");
                return;
            }

            const btn = document.getElementById('btn-upload');
            const status = document.getElementById('upload-status');
            const subject = document.getElementById('upload-subject').value;

            // 鎖定按鈕，顯示 Loading
            btn.disabled = true;
            btn.innerHTML = '<div class="loader mr-2"></div> 上傳中...';
            status.textContent = "正在上傳圖片...";
            status.className = "text-center text-sm text-teal-600 h-5";

            try {
                // A. 上傳圖片到 Storage
                const fileName = `questions/${Date.now()}.png`;
                const storageRef = ref(storage, fileName);
                
                await uploadBytes(storageRef, currentUploadBlob);
                const downloadURL = await getDownloadURL(storageRef);

                // B. 寫入 Firestore 資料庫
                status.textContent = "正在寫入資料庫...";
                await addDoc(collection(db, "question_bank"), {
                    imageUrl: downloadURL,
                    subject: subject,
                    createdAt: new Date()
                });

                // C. 成功處理
                alert(`✅ 成功儲存到「${subject}」題庫！`);
                resetUploadForm();
                
                // 自動切換到題庫並重新整理
                window.switchTab('library');
                document.getElementById('filter-subject').value = subject;
                window.loadQuestions();

            } catch (error) {
                console.error("Upload Error:", error);
                alert("❌ 上傳失敗：" + error.message + "\n請確認網路連線或 Firebase 權限設定。");
            } finally {
                // D. 無論成功失敗，都要恢復按鈕狀態 (解決無限轉圈)
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-upload mr-2"></i> 儲存到雲端題庫';
                status.textContent = "";
            }
        };

        // === 2. 讀取題庫邏輯 ===
        window.loadQuestions = async () => {
            const grid = document.getElementById('library-grid');
            const filter = document.getElementById('filter-subject').value;
            
            grid.innerHTML = '<div class="col-span-2 text-center py-4"><div class="loader mx-auto"></div></div>';

            try {
                let q;
                const bankRef = collection(db, "question_bank");
                
                if (filter === 'all') {
                    q = query(bankRef, orderBy("createdAt", "desc"), limit(20));
                } else {
                    q = query(bankRef, where("subject", "==", filter), orderBy("createdAt", "desc"), limit(20));
                }

                const querySnapshot = await getDocs(q);
                
                grid.innerHTML = ""; // 清空 Loading

                if (querySnapshot.empty) {
                    grid.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-4">目前沒有題目</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = "relative group cursor-pointer border rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition aspect-[4/3]";
                    div.onclick = () => addToCanvas(data.imageUrl);
                    
                    div.innerHTML = `
                        <img src="${data.imageUrl}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition flex items-center justify-center">
                            <i class="fa-solid fa-plus text-white opacity-0 group-hover:opacity-100 text-2xl drop-shadow-md"></i>
                        </div>
                        <span class="absolute bottom-1 right-1 bg-black bg-opacity-50 text-white text-xs px-1 rounded">${data.subject}</span>
                    `;
                    grid.appendChild(div);
                });

            } catch (error) {
                console.error("Load Error:", error);
                // 這裡通常是因為還沒建立 index，如果是測試模式可以忽略
                if(error.message.includes("requires an index")) {
                   alert("Firebase 需要建立索引，請檢查 Console 的連結");
                }
                grid.innerHTML = '<div class="col-span-2 text-center text-red-400 py-4">讀取失敗，請稍後再試</div>';
            }
        };

        // 初始載入一次
        window.loadQuestions();
    </script>

    <script>
        // Tab 切換
        function switchTab(tabName) {
            const uploadTab = document.getElementById('tab-upload');
            const libraryTab = document.getElementById('tab-library');
            const uploadPanel = document.getElementById('panel-upload');
            const libraryPanel = document.getElementById('panel-library');

            if (tabName === 'upload') {
                uploadTab.className = "flex-1 py-4 text-center tab-active";
                libraryTab.className = "flex-1 py-4 text-center tab-inactive";
                uploadPanel.classList.remove('hidden');
                libraryPanel.classList.add('hidden');
            } else {
                uploadTab.className = "flex-1 py-4 text-center tab-inactive";
                libraryTab.className = "flex-1 py-4 text-center tab-active";
                uploadPanel.classList.add('hidden');
                libraryPanel.classList.remove('hidden');
                // 切換時自動重整
                if(window.loadQuestions) window.loadQuestions();
            }
        }

        // 檔案處理
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                processFile(input.files[0]);
            }
        }

        function processFile(file) {
            currentUploadBlob = file; // 存到全域變數準備上傳
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('img-preview');
                const area = document.getElementById('preview-area');
                img.src = e.target.result;
                img.classList.remove('hidden');
                area.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function resetUploadForm() {
            currentUploadBlob = null;
            document.getElementById('file-input').value = "";
            document.getElementById('img-preview').classList.add('hidden');
            document.getElementById('preview-area').classList.remove('hidden');
        }

        // 全域貼上監聽
        window.addEventListener('paste', function(e) {
            // 如果當前在「從題庫選」分頁，自動切回「新增題目」
            switchTab('upload');
            
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.includes('image/')) {
                    processFile(item.getAsFile());
                }
            }
        });

        // 將題目加入畫布
        function addToCanvas(url) {
            const container = document.getElementById('questions-container');
            document.getElementById('empty-hint').style.display = 'none';

            const wrapper = document.createElement('div');
            wrapper.className = 'resize-drag absolute touch-none inline-block';
            // 隨機錯開位置避免重疊
            const randX = Math.floor(Math.random() * 50);
            const randY = Math.floor(Math.random() * 50);
            wrapper.style.left = `${40 + randX}px`;
            wrapper.style.top = `${40 + randY}px`;
            wrapper.style.width = '300px';

            wrapper.innerHTML = `
                <img src="${url}" class="w-full h-auto shadow-lg border-2 border-transparent hover:border-teal-500 transition cursor-move">
                <button class="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full text-xs shadow z-10" 
                        onclick="this.parentElement.remove()" 
                        ontouchend="this.parentElement.remove()">
                    <i class="fa-solid fa-times"></i>
                </button>
            `;
            container.appendChild(wrapper);
        }

        // 下載 PDF
        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            // 暫時移除縮放以確保清晰度
            const originalTransform = element.style.transform;
            element.style.transform = 'none';
            
            html2pdf().set({
                margin: 0,
                filename: '錯題筆記.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true }, // useCORS 重要！否則 Firebase 圖片無法下載
                jsPDF: { unit: 'mm', format: 'b5', orientation: 'portrait' }
            }).from(element).save().then(() => {
                element.style.transform = originalTransform;
            });
        }

        // Interact.js 設定 (拖拉與縮放)
        interact('.resize-drag')
            .draggable({
                listeners: { move: dragMoveListener },
                modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ]
            })
            .resizable({
                edges: { left: true, right: true, bottom: true, top: true },
                listeners: { move: resizeMoveListener }
            });

        function dragMoveListener (event) {
            var target = event.target;
            var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
            var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
            target.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
            target.setAttribute('data-x', x); target.setAttribute('data-y', y);
        }
        function resizeMoveListener(event) {
            var target = event.target;
            var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.deltaRect.left;
            var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.deltaRect.top;
            Object.assign(target.style, { width: `${event.rect.width}px`, height: `${event.rect.height}px`, transform: `translate(${x}px, ${y}px)` });
            Object.assign(target.dataset, { x, y });
        }

        // 手機版自動縮放畫布以適應螢幕
        function scaleCanvas() {
            if(window.innerWidth < 768) {
                const scaler = document.getElementById('canvas-scaler');
                const parentWidth = scaler.parentElement.clientWidth;
                const pdfWidth = 176 * 3.78; // B5 mm to px approx
                const scale = (parentWidth - 32) / pdfWidth; // 32 is padding
                scaler.style.transform = `scale(${scale})`;
                scaler.style.height = `${(250 * 3.78) * scale}px`; // Adjust height container
            } else {
                 document.getElementById('canvas-scaler').style.transform = 'none';
                 document.getElementById('canvas-scaler').style.height = 'auto';
            }
        }
        window.addEventListener('resize', scaleCanvas);
        window.onload = scaleCanvas;
    </script>
</body>
</html>
