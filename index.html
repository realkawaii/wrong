<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯題紀錄系統 (Firebase版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F3F4F6; }
        
        .btn-primary { background-color: #1a5f54; color: white; }
        .btn-primary:hover { background-color: #134e44; }
        .dashed-border { border: 2px dashed #fcd34d; background-color: #fffbeb; }
        .grid-bg {
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #pdf-content {
            width: 176mm; min-height: 250mm; background: white; margin: 0 auto;
            position: relative; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .hidden-section { display: none; }
        
        /* Loading 動畫 */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #1a5f54; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="home-section" class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 text-center transition-all">
        <div class="mb-6 flex justify-center">
            <div class="w-20 h-20 bg-teal-50 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-teal-600"></i>
            </div>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">錯題紀錄系統</h1>
        <p class="text-gray-500 mb-8 text-sm">支援 Firebase 雲端同步功能</p>

        <button onclick="window.openUploadModal()" class="w-full btn-primary py-3 rounded-xl font-bold text-lg mb-4 shadow-lg transition transform hover:scale-105">
            <i class="fa-solid fa-plus mr-2"></i> 開始製作
        </button>

        <button onclick="window.goToPreview()" class="w-full bg-white border-2 border-gray-100 text-gray-600 py-3 rounded-xl font-bold text-lg mb-6 hover:bg-gray-50 transition">
            檢視題本
        </button>

        <div class="dashed-border rounded-xl p-4 cursor-pointer text-orange-700 font-medium transition hover:bg-orange-50 relative group">
            <i class="fa-regular fa-clipboard mr-2"></i> 電腦截圖貼上 (Ctrl + V)
        </div>
    </div>

    <div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="window.closeModal('upload-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
            <div class="flex items-center mb-8">
                <span class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold mr-2">1</span>
                <span class="text-gray-400">———</span>
                <span class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold ml-2">2</span>
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-2xl h-64 flex flex-col items-center justify-center text-center space-y-4 mb-6">
                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center text-orange-500 text-2xl mb-2">
                    <i class="fa-regular fa-paste"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800">請按下 Ctrl + V</h3>
                <p class="text-gray-500 text-sm">直接貼上電腦截圖，AI 將自動讀取</p>
                <label class="flex items-center space-x-2 bg-teal-50 px-4 py-2 rounded-lg cursor-pointer border border-teal-100">
                    <input type="checkbox" id="ai-check" checked class="w-5 h-5 text-teal-600 rounded focus:ring-teal-500">
                    <span class="text-teal-700 font-medium text-sm">啟用 AI 自動分析</span>
                </label>
            </div>
        </div>
    </div>

    <div id="editor-section" class="hidden-section w-full h-full flex flex-col bg-gray-100">
        <div class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <div class="flex items-center space-x-4">
                <button onclick="window.goHome()" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-arrow-left"></i> 返回</button>
                <input type="text" id="paper-title" value="112會考社會科" class="font-bold text-lg text-gray-700 border-b border-transparent hover:border-gray-300 focus:outline-none">
            </div>
            <div class="flex space-x-2">
                <button id="btn-save-cloud" onclick="window.saveToFirebase()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg shadow flex items-center transition">
                    <i class="fa-solid fa-cloud-upload-alt mr-2"></i> 儲存到雲端
                </button>
                <button onclick="window.downloadPDF()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg shadow flex items-center">
                    <i class="fa-solid fa-file-pdf mr-2"></i> 下載 PDF
                </button>
            </div>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-80 bg-white border-r p-6 overflow-y-auto hidden md:block">
                <h3 class="font-bold text-gray-800 mb-4">題目資訊</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">日期</label>
                        <input type="date" id="meta-date" class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">科目</label>
                        <select id="meta-subject" class="w-full border rounded p-2 text-sm bg-white">
                            <option>公民</option><option>歷史</option><option>地理</option><option>數學</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">核心知識點</label>
                        <textarea id="meta-note" class="w-full border rounded p-2 text-sm h-24" placeholder="AI 分析中...">國際貿易與匯率、供需法則</textarea>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-gray-200 overflow-auto p-8 flex justify-center">
                <div id="pdf-content" class="grid-bg relative">
                    <div class="p-8 pb-4 border-b-2 border-gray-800 mb-4 flex justify-between items-end">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-800">錯題筆記</h1>
                            <p class="text-sm text-gray-500 mt-1">Note System</p>
                        </div>
                        <div class="text-right">
                            <div class="text-4xl font-mono font-bold text-gray-200">NO.01</div>
                        </div>
                    </div>
                    <div id="questions-container" class="p-8 pt-0 min-h-[600px]">
                        <div class="text-gray-300 text-center mt-20 pointer-events-none select-none" id="empty-state">
                            <i class="fa-regular fa-image text-4xl mb-2"></i>
                            <p>圖片將顯示於此</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. 引入 Firebase 模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Firebase 設定 (您提供的)
        const firebaseConfig = {
            apiKey: "AIzaSyADCazAIbNTwIdr3VO1Q05sJzvni4rvezA",
            authDomain: "wrong-34862.firebaseapp.com",
            projectId: "wrong-34862",
            storageBucket: "wrong-34862.firebasestorage.app",
            messagingSenderId: "100761873917",
            appId: "1:100761873917:web:6f82d3e744828694b43d94",
            measurementId: "G-DER4Q7G6YN"
        };

        // 3. 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        // 暫存圖片 Blob 的陣列 (為了上傳用)
        let imageBlobs = []; 

        // === 將功能掛載到 window 以便 HTML onclick 使用 ===
        
        window.openUploadModal = () => document.getElementById('upload-modal').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        window.goHome = () => {
            document.getElementById('editor-section').classList.add('hidden-section');
            document.getElementById('home-section').classList.remove('hidden-section');
        };

        window.goToPreview = () => {
            document.getElementById('home-section').classList.add('hidden-section');
            document.getElementById('editor-section').classList.remove('hidden-section');
            // 設定今天日期
            document.getElementById('meta-date').valueAsDate = new Date();
        };

        window.downloadPDF = () => {
            const element = document.getElementById('pdf-content');
            html2pdf().set({
                margin: 0, filename: 'mistake_note.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'b5', orientation: 'portrait' }
            }).from(element).save();
        };

        // === 核心：處理貼上與圖片 ===
        window.processImage = (blob) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                // 將 blob 存起來準備上傳
                imageBlobs.push({ blob: blob, id: Date.now() });
                
                addImageToCanvas(e.target.result);
                window.goToPreview();
            };
            reader.readAsDataURL(blob);
        };

        // 監聽 Ctrl+V
        window.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.includes('image/')) {
                    const blob = item.getAsFile();
                    window.processImage(blob);
                    window.closeModal('upload-modal');
                }
            }
        });

        function addImageToCanvas(imgSrc) {
            const container = document.getElementById('questions-container');
            const emptyState = document.getElementById('empty-state');
            if(emptyState) emptyState.remove();

            const wrapper = document.createElement('div');
            wrapper.className = 'resize-drag absolute touch-none inline-block';
            wrapper.style.left = '40px'; wrapper.style.top = '40px'; wrapper.style.width = '400px';
            
            wrapper.innerHTML = `
                <img src="${imgSrc}" class="w-full h-auto shadow-lg border-2 border-transparent hover:border-teal-500 transition">
                <button class="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full text-xs shadow hidden group-hover:block" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-times"></i>
                </button>
            `;
            
            wrapper.onmouseenter = () => wrapper.querySelector('button').classList.remove('hidden');
            wrapper.onmouseleave = () => wrapper.querySelector('button').classList.add('hidden');
            container.appendChild(wrapper);
        }

        // === Firebase 儲存邏輯 ===
        window.saveToFirebase = async () => {
            const btn = document.getElementById('btn-save-cloud');
            const originalText = btn.innerHTML;
            
            // 1. UI 變更為 Loading
            btn.innerHTML = '<div class="loader mr-2"></div> 上傳中...';
            btn.disabled = true;

            try {
                // 收集表單資料
                const title = document.getElementById('paper-title').value;
                const subject = document.getElementById('meta-subject').value;
                const date = document.getElementById('meta-date').value;
                const note = document.getElementById('meta-note').value;
                let uploadedImageUrls = [];

                // 2. 上傳所有圖片到 Storage
                if (imageBlobs.length > 0) {
                    for (let item of imageBlobs) {
                        const fileName = `images/${Date.now()}_${Math.random().toString(36).substring(7)}.png`;
                        const storageRef = ref(storage, fileName);
                        
                        // 上傳
                        const snapshot = await uploadBytes(storageRef, item.blob);
                        // 取得下載連結
                        const url = await getDownloadURL(snapshot.ref);
                        uploadedImageUrls.push(url);
                    }
                } else {
                    console.log("沒有新圖片需要上傳");
                }

                // 3. 寫入資料庫 Firestore
                const docRef = await addDoc(collection(db, "questions"), {
                    title: title,
                    subject: subject,
                    date: date,
                    note: note,
                    images: uploadedImageUrls,
                    createdAt: serverTimestamp()
                });

                console.log("Document written with ID: ", docRef.id);
                alert("✅ 雲端儲存成功！");
                
                // 清空已上傳陣列避免重複上傳 (簡單實作)
                imageBlobs = []; 

            } catch (e) {
                console.error("Error adding document: ", e);
                alert("❌ 儲存失敗，請檢查 Console 或確認 Firebase 權限設定 (Test Mode)。\n錯誤訊息: " + e.message);
            } finally {
                // 復原按鈕
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        // Interact.js 設定 (維持不變)
        interact('.resize-drag').draggable({
            listeners: { move: dragMoveListener },
            modifiers: [ interact.modifiers.restrictRect({ restriction: 'parent', endOnly: true }) ]
        }).resizable({
            edges: { left: true, right: true, bottom: true, top: true },
            listeners: { move: resizeMoveListener }
        });

        function dragMoveListener (event) {
            var target = event.target;
            var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
            var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
            target.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
            target.setAttribute('data-x', x); target.setAttribute('data-y', y);
        }
        function resizeMoveListener(event) {
            var target = event.target;
            var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.deltaRect.left;
            var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.deltaRect.top;
            Object.assign(target.style, { width: `${event.rect.width}px`, height: `${event.rect.height}px`, transform: `translate(${x}px, ${y}px)` });
            Object.assign(target.dataset, { x, y });
        }
    </script>
</body>
</html>
